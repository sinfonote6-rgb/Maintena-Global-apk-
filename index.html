.t{font-weight:600}
.pill{font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.Over,.open{color:var(--bd)}.Soon{color:var(--wa)}.OK,.solved{color:var(--ok)}

.chips button.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit}
textarea{min-height:76px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--ai);font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:none;color:var(--ac);border:1px solid var(--ac);margin-top:8px}
.btn.bad{background:none;color:var(--bd);border:1px solid var(--bd)}
.link{border:0;background:none;color:var(--ac);font:inherit;padding:8px 0;cursor:pointer}
a{color:var(--ac)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{max-width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:8px;display:block}
.bar{height:10px;border-radius:5px;background:var(--ac);min-width:3px}
.br{display:grid;grid-template-columns:64px 1fr 84px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.empty{color:var(--mu);text-align:center;padding:22px 0}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1}
select.lang{width:auto;padding:5px 8px;font-size:13px}
</style>

function mItem(m){var s=st(m);return '<div class="item tap" onclick="tab=\'machines\';openM='+m.id+';form=null;render()"><div class="row"><span class="t">'+E(m.name)+'</span><span class="pill '+s[0]+'">'+s[1]+'</span></div><div class="sub">'+E(m.loc)+' · '+E(m.svcType)+(m.sh>0?' · '+m.hrs+' h':'')+'</div></div>'}
function home(){var att2=S.machines.filter(function(m){return st(m)[0]!=="OK"}).sort(function(a,b){return left(a)-left(b)}),op=S.problems.filter(function(p){return p.status==="open"}),lp=S.parts.filter(function(p){return p.qty<=p.min});
var rs=recs(),mo=today.slice(0,7),mc=0,yc=0;rs.forEach(function(r){if(r.d.slice(0,7)===mo)mc+=r.c;if(r.d.slice(0,4)===today.slice(0,4))yc+=r.c});
return '<div class="grid"><div class="stat"><div class="n">'+S.machines.length+'</div><div class="l">'+T("mc")+'</div></div><div class="stat"><div class="n Over">'+op.length+'</div><div class="l">'+T("openP")+'</div></div><div class="stat"><div class="n Soon">'+att2.length+'</div><div class="l">'+T("needs")+'</div></div><div class="stat"><div class="n '+(lp.length?"Over":"OK")+'">'+lp.length+'</div><div class="l">'+T("lowP")+'</div></div>'+
(isAdmin()?'<div class="stat"><div class="n" style="font-size:20px">'+money(mc)+'</div><div class="l">'+T("thisM")+'</div></div><div class="stat"><div class="n" style="font-size:20px">'+money(yc)+'</div><div class="l">'+T("thisY")+'</div></div>':'')+'</div>'+
'<h2>'+T("needs")+'</h2>'+(att2.length?att2.map(mItem).join(""):'<div class="empty">'+T("none")+'</div>')+
'<h2>'+T("openP")+'</h2>'+(op.length?op.map(pItem).join(""):'<div class="empty">'+T("none")+'</div>')}

/* ---------- machines ---------- */
function machines(){
if(openM!==null)return mDetail();
if(form==="addM")return addMForm();
var ty=["All"].concat(S.machines.map(function(m){return m.type}).filter(function(t,i,a){return a.indexOf(t)===i}));
var sh=S.machines.filter(function(m){return fil==="All"||m.type===fil}).sort(function(a,b){return left(a)-left(b)});
return '<div class="row"><h2>'+T("machines")+'</h2>'+(isAdmin()?'<button class="link" onclick="form=\'addM\';render()">＋ '+T("add")+'</button>':'')+'</div><div class="chips">'+ty.map(function(t){return '<button class="'+(fil===t?"on":"")+'" onclick="fil=this.dataset.t;render()" data-t="'+E(t)+'">'+(t==="All"?T("all"):E(t))+'</button>'}).join("")+'</div>'+(sh.length?sh.map(mItem).join(""):'<div class="empty">'+T("none")+'</div>')}
function addMForm(){return '<button class="link" onclick="form=null;render()">‹ '+T("back")+'</button><h2>'+T("add")+' · '+T("machines")+'</h2>'+fld("a_t",T("mtype"),"","text","Air Compressor")+fld("a_n",T("count"),1,"number")+area("a_d",T("details"))+fld("a_l",T("loc"))+fld("a_s",T("svcType"))+'<div class="two"><div>'+fld("a_iv",T("evD"),90,"number")+'</div><div>'+fld("a_sh",T("evH"),0,"number")+'</div></div>'+fld("a_h",T("hrs"),0,"number")+fld("a_ld",T("last"),today,"date")+fld("a_sn",T("sug")+" · "+T("name"))+fld("a_sp",T("sug")+" · "+T("phone"),"","tel")+'<button class="btn" onclick="addM()">'+T("save")+'</button>'}
function addM(){var t=v("a_t").trim(),n=Math.min(Math.max(+v("a_n")||1,1),50),iv=+v("a_iv");if(!t||!(iv>=1)){toast(T("req"));return}
var ex=S.machines.filter(function(m){return m.type===t}).length,h=+v("a_h")||0;
for(var i=1;i<=n;i++)S.machines.push({id:S.n++,name:n>1||ex?t+" "+(ex+i):t,type:t,loc:v("a_l"),details:v("a_d"),svcType:v("a_s")||"Service",iv:iv,last:v("a_ld")||today,hrs:h,sh:+v("a_sh")||0,lh:h,sn:v("a_sn"),sp:v("a_sp")});
save();form=null;toast(T("saved"));render()}
function mDetail(){var m=mById(openM);if(!m){openM=null;return machines()}
var s=st(m),hs=S.services.filter(function(x){return x.mid===m.id}).sort(function(a,b){return a.date<b.date?1:-1}),ps=S.problems.filter(function(p){return p.mid===m.id}).sort(function(a,b){return a.date<b.date?1:-1});
return '<button class="link" onclick="openM=null;form=null;render()">‹ '+T("back")+'</button><div class="card"><div class="row"><h3 style="margin:0">'+E(m.name)+'</h3><span class="pill '+s[0]+'">'+s[1]+'</span></div><p class="sub">'+E(m.type)+' · '+E(m.loc)+'</p>'+(m.details?'<p>'+E(m.details)+'</p>':'')+
'<p>'+T("svcType")+': <b>'+E(m.svcType)+'</b><br>'+T("last")+': <b>'+m.last+'</b><br>'+T("next")+': <b>'+addTo(m.last,m.iv)+'</b> ('+T("evD")+': '+m.iv+')'+(m.sh>0?'<br>'+T("evH")+': <b>'+m.sh+'</b> · '+hl(m)+' '+T("h"):'')+'</p>'+
'<p>'+T("sug")+': <b>'+E(m.sn||"—")+'</b><br>'+tel(m.sp)+'</p>'+fld("h_"+m.id,T("hrs"),m.hrs,"number")+'<button class="btn alt" onclick="setHrs('+m.id+')">'+T("save")+'</button></div>'+
(form==="svc"?'<div class="card"><h3>'+T("rec")+'</h3><div class="sub">'+T("by")+': '+E(me.name)+'</div>'+area("s_n",T("note"))+fld("s_c",T("cost"),"","number")+file("s_f",T("photo"))+'<button class="btn" onclick="doSvc('+m.id+')">'+T("save")+'</button><button class="btn alt" onclick="form=null;render()">‹ '+T("back")+'</button></div>':'<div class="two"><button class="btn" onclick="form=\'svc\';render()">'+T("rec")+'</button><button class="btn alt" style="margin-top:14px" onclick="pm='+m.id+';tab=\'problems\';openM=null;form=\'addP\';render()">'+T("rep")+'</button></div>')+
'<h2>'+T("hist")+'</h2>'+(hs.length?hs.map(function(x){return '<div class="item"><div class="row"><span class="t">'+x.date+'</span><span class="sub">'+E(x.tech)+(isAdmin()?' · '+money(x.cost||0):'')+'</span></div><div class="sub">'+E(x.note)+'</div>'+att(x.photo)+'</div>'}).join(""):'<div class="empty">'+T("none")+'</div>')+
'<h2>'+T("problems")+'</h2>'+(ps.length?ps.map(pItem).join(""):'<div class="empty">'+T("none")+'</div>')+(isAdmin()?'<button class="btn bad" onclick="delM('+m.id+')">'+T("del")+'</button>':'')}
function setHrs(id){var n=+v("h_"+id);if(!(n>=0)){toast(T("req"));return}mById(id).hrs=n;save();toast(T("saved"));render()}
async function doSvc(id){var m=mById(id),p=await up("s_f");S.services.push({id:S.n++,mid:id,date:nowS(),tech:me.name,note:v("s_n")||"Service",cost:+v("s_c")||0,photo:p});m.last=today;m.lh=m.hrs;form=null;save();toast(T("saved"));render()}
function delM(id){S.machines=S.machines.filter(function(m){return m.id!==id});openM=null;save();render()}

/* ---------- problems ---------- */
function pItem(p){return '<div class="item tap" onclick="tab=\'problems\';openM=null;openP='+p.id+';form=null;render()"><div class="row"><span class="t">'+E(mName(p.mid))+'</span><span class="pill '+p.status+'">'+T(p.status)+'</span></div><div class="sub">'+E(p.text)+'</div><div class="sub">'+p.date+' · '+E(p.by)+'</div></div>'}
function problems(){
if(openP!==null)return pDetail();
if(form==="addP")return '<button class="link" onclick="form=null;pm=null;render()">‹ '+T("back")+'</button><h2>'+T("rep")+'</h2>'+sel("p_m",T("mach"),S.machines.map(function(m){return[m.id,m.name]}))+area("p_t",T("prob"))+file("p_f",T("photo"))+'<button class="btn" onclick="addP()">'+T("save")+'</button>'+(pm?'<script>document.getElementById("p_m").value="'+pm+'"<\/script>':'');
var l=S.problems.slice().sort(function(a,b){return a.date<b.date?1:-1});
return '<div class="row"><h2>'+T("problems")+'</h2><button class="link" onclick="form=\'addP\';render()">＋ '+T("rep")+'</button></div>'+(l.length?l.map(pItem).join(""):'<div class="empty">'+T("none")+'</div>')}
async function addP(){if(!v("p_t").trim()){toast(T("req"));return}var f=await up("p_f");S.problems.push({id:S.n++,mid:+v("p_m"),date:nowS(),text:v("p_t"),photo:f,by:me.name,status:"open"});form=null;pm=null;save();toast(T("saved"));render()}
function pDetail(){var p=S.problems.filter(function(x){return x.id===openP})[0];if(!p){openP=null;return problems()}var m=mById(p.mid);
return '<button class="link" onclick="openP=null;form=null;render()">‹ '+T("back")+'</button><div class="card"><div class="row"><h3 style="margin:0">'+E(mName(p.mid))+'</h3><span class="pill '+p.status+'">'+T(p.status)+'</span></div><p class="sub">'+p.date+' · '+T("by")+' '+E(p.by)+'</p><p>'+E(p.text)+'</p>'+att(p.photo)+'</div>'+
(p.status==="solved"?'<div class="card"><h3>'+T("sol")+'</h3><p class="sub">'+p.solDate+' · '+T("by")+' '+E(p.solBy)+(isAdmin()?' · '+money(p.cost||0):'')+'</p><p>'+E(p.sol)+'</p>'+att(p.solPhoto)+'</div>':
(m&&m.sn?'<div class="card"><h3>'+T("sug")+'</h3><b>'+E(m.sn)+'</b><br>'+tel(m.sp)+'</div>':'')+(form==="sol"?'<div class="card"><h3>'+T("addSol")+'</h3>'+area("o_t",T("sol"))+fld("o_c",T("cost"),"","number")+file("o_f",T("photo"))+'<button class="btn" onclick="addSol('+p.id+')">'+T("save")+'</button></div>':'<button class="btn" onclick="form=\'sol\';render()">'+T("addSol")+'</button>'))}
async function addSol(id){if(!v("o_t").trim()){toast(T("req"));return}var f=await up("o_f"),p=S.problems.filter(function(x){return x.id===id})[0];p.status="solved";p.sol=v("o_t");p.solPhoto=f;p.cost=+v("o_c")||0;p.solDate=nowS();p.solBy=me.name;form=null;save();toast(T("saved"));render()}

/* ---------- parts ---------- */
function parts(){
if(openPt!==null)return ptDetail();
if(form==="addPt")return '<button class="link" onclick="form=null;render()">‹ '+T("back")+'</button><h2>'+T("add")+' · '+T("parts")+'</h2>'+fld("t_n",T("partName"))+fld("t_t",T("forT"),"","text","Air Compressor")+'<div class="two"><div>'+fld("t_q",T("qty"),0,"number")+'</div><div>'+fld("t_m",T("min"),2,"number")+'</div></div>'+fld("t_s",T("shop"))+fld("t_p",T("phone"),"","tel")+fld("t_l",T("loc"))+'<button class="btn" onclick="addPt()">'+T("save")+'</button>';
var l=S.parts.slice().sort(function(a,b){return (b.qty<=b.min)-(a.qty<=a.min)});
return '<div class="row"><h2>'+T("parts")+'</h2>'+(isAdmin()?'<button class="link" onclick="form=\'addPt\';render()">＋ '+T("add")+'</button>':'')+'</div>'+l.map(function(p){return '<div class="item"><div class="row"><div class="tap" style="flex:1" onclick="openPt='+p.id+';form=null;render()"><div class="t">'+E(p.name)+'</div><div class="sub">'+E(p.type)+' · '+E(p.shop||"—")+'</div>'+(p.qty<=p.min?'<span class="pill Over">'+T("low")+'</span>':'')+'</div><div class="qty"><button onclick="adj('+p.id+',-1)">−</button><b>'+p.qty+'</b><button onclick="adj('+p.id+',1)">＋</button></div></div></div>'}).join("")}
function pById(i){return S.parts.filter(function(p){return p.id===i})[0]}
function adj(id,d){var p=pById(id);p.qty=Math.max(0,p.qty+d);save();render()}
function addPt(){if(!v("t_n").trim()){toast(T("req"));return}S.parts.push({id:S.n++,name:v("t_n"),type:v("t_t")||"General",qty:+v("t_q")||0,min:+v("t_m")||0,shop:v("t_s"),sp:v("t_p"),loc:v("t_l")});form=null;save();toast(T("saved"));render()}
function ptDetail(){var p=pById(openPt);if(!p){openPt=null;return parts()}var bs=S.purchases.filter(function(b){return b.pid===p.id}).sort(function(a,b){return a.date<b.date?1:-1});
return '<button class="link" onclick="openPt=null;form=null;render()">‹ '+T("back")+'</button><div class="card"><div class="row"><h3 style="margin:0">'+E(p.name)+'</h3><b>'+p.qty+'</b></div><p class="sub">'+E(p.type)+' · '+T("min")+' '+p.min+'</p><p>'+T("shop")+': <b>'+E(p.shop||"—")+'</b><br>'+T("loc")+': '+E(p.loc||"—")+'<br>'+tel(p.sp)+'</p></div>'+
(isAdmin()?(form==="buy"?'<div class="card"><h3>'+T("buy")+'</h3><div class="two"><div>'+fld("b_q",T("qty"),1,"number")+'</div><div>'+fld("b_c",T("cost"),"","number")+'</div></div>'+fld("b_d",T("bdate"),today,"date")+fld("b_s",T("shop"),p.shop)+fld("b_p",T("phone"),p.sp,"tel")+file("b_f",T("bill"))+'<button class="btn" onclick="buy('+p.id+')">'+T("save")+'</button></div>':'<button class="btn" onclick="form=\'buy\';render()">'+T("buy")+'</button>'):'')+
'<h2>'+T("buys")+'</h2>'+(bs.length?bs.map(function(b){return '<div class="item"><div class="row"><span class="t">'+b.date+'</span><span>'+(isAdmin()?money(b.cost):'')+'</span></div><div class="sub">'+T("qty")+' +'+b.qty+' · '+E(b.shop||"")+'</div>'+att(b.bill)+'</div>'}).join(""):'<div class="empty">'+T("none")+'</div>')}
async function buy(id){var p=pById(id),q=+v("b_q")||0;if(q<1){toast(T("req"));return}var f=await up("b_f");S.purchases.push({id:S.n++,pid:id,date:v("b_d")||today,qty:q,cost:+v("b_c")||0,shop:v("b_s"),sp:v("b_p"),bill:f});p.qty+=q;if(v("b_s")){p.shop=v("b_s");p.sp=v("b_p")}form=null;save();toast(T("saved"));render()}

/* ---------- costs ---------- */
function costs(){var rs=recs(),ys=[today.slice(0,4)];rs.forEach(function(r){var y=r.d.slice(0,4);if(ys.indexOf(y)<0)ys.push(y)});ys.sort().reverse();
var yt={},mo=[],k={cs:0,cp:0,cr:0},bm={};for(var i=0;i<12;i++)mo.push(0);
rs.forEach(function(r){var y=r.d.slice(0,4);yt[y]=(yt[y]||0)+r.c;if(y===yr){mo[+r.d.slice(5,7)-1]+=r.c;k[r.k]+=r.c;if(r.m)bm[r.m]=(bm[r.m]||0)+r.c}});
var mx=Math.max.apply(null,mo.concat([1])),tot=mo.reduce(function(a,b){return a+b},0),ids=Object.keys(bm).sort(function(a,b){return bm[b]-bm[a]}).slice(0,6),bx=Math.max.apply(null,ids.map(function(i){return bm[i]}).concat([1])),M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
return '<h2>'+T("costs")+'</h2><div class="chips">'+ys.map(function(y){return '<button class="'+(yr===y?"on":"")+'" onclick="yr=\''+y+'\';render()">'+y+'</button>'}).join("")+'</div><div class="stat"><div class="n" style="font-size:24px">'+money(tot)+'</div><div class="l">'+T("total")+' · '+yr+'</div></div>'+
'<div class="card"><h3>'+T("month")+'</h3>'+mo.map(function(c,i){return '<div class="br"><span>'+M[i]+'</span><div class="bar" style="width:'+Math.round(c/mx*100)+'%"></div><span>'+money(c)+'</span></div>'}).join("")+'</div>'+
'<div class="card"><h3>'+T("year")+'</h3>'+ys.map(function(y){return '<div class="row" style="margin:6px 0"><span>'+y+'</span><b>'+money(yt[y]||0)+'</b></div>'}).join("")+'</div>'+
'<div class="card">'+["cs","cp","cr"].map(function(x){return '<div class="row" style="margin:6px 0"><span>'+T(x)+'</span><b>'+money(k[x])+'</b></div>'}).join("")+'</div>'+
'<div class="card"><h3>'+T("cm")+'</h3>'+ids.map(function(i){return '<div class="br" style="grid-template-columns:96px 1fr 84px"><span>'+E(mName(+i))+'</span><div class="bar" style="width:'+Math.round(bm[i]/bx*100)+'%"></div><span>'+money(bm[i])+'</span></div>'}).join("")+'</div>'}

/* ---------- team ---------- */
function team(){
if(form==="addT"){var used=S.techs.map(function(t){return t.id}),fr=[];for(var i=1;i<=10;i++)if(used.indexOf(i)<0)fr.push([i,String(i)]);
return '<button class="link" onclick="form=null;render()">‹ '+T("back")+'</button><h2>'+T("addT")+'</h2>'+sel("n_i",T("tid"),fr)+fld("n_n",T("name"))+fld("n_p",T("phone"),"","tel")+fld("n_w",T("pass"),"","text")+'<button class="btn" onclick="addT()">'+T("save")+'</button>'}
var jobs=function(n){return S.services.filter(function(x){return x.tech===n}).length+S.problems.filter(function(p){return p.solBy===n}).length};
return '<div class="row"><h2>'+T("team")+'</h2>'+(isAdmin()&&S.techs.length<10?'<button class="link" onclick="form=\'addT\';render()">＋ '+T("addT")+'</button>':'')+'</div>'+(isAdmin()?'<div class="sub">'+T("maxT")+' ('+S.techs.length+'/10)</div><div class="card"><div class="t">'+T("admin")+'</div><div class="sub">'+E(S.admin.email)+'</div></div>':'')+
S.techs.map(function(t){return '<div class="item"><div class="row"><span class="t">#'+t.id+' · '+E(t.name)+'</span><span class="sub">'+T("jobs")+': '+jobs(t.name)+'</span></div><div class="sub">'+tel(t.phone)+(isAdmin()?' · '+T("pass")+': '+E(t.pass):'')+'</div>'+(isAdmin()?'<button class="link" style="color:var(--bd)" onclick="delT('+t.id+')">'+T("del")+'</button>':'')+'</div>'}).join("")}
function addT(){if(!v("n_n").trim()||!v("n_w")){toast(T("req"));return}S.techs.push({id:+v("n_i"),name:v("n_n"),phone:v("n_p"),pass:v("n_w")});S.techs.sort(function(a,b){return a.id-b.id});form=null;save();toast(T("saved"));render()}
function delT(id){S.techs=S.techs.filter(function(t){return t.id!==id});save();render()}

/* ---------- shell ---------- */
function render(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
var app=document.getElementById("app"),nav=document.getElementById("nav");
if(!me){app.innerHTML=loginView();nav.innerHTML="";return}
var tabs=[["home","▦"],["machines","⚙"],["problems","⚠"],["parts","📦"]];if(isAdmin())tabs.push(["costs","💰"]);tabs.push(["team","👥"]);
nav.innerHTML='<div>'+tabs.map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';openM=openP=openPt=null;form=null;render();window.scrollTo(0,0)"><b>'+t[1]+'</b>'+T(t[0])+'</button>'}).join("")+'</div>';
var body=tab==="home"?home():tab==="machines"?machines():tab==="problems"?problems():tab==="parts"?parts():tab==="costs"&&isAdmin()?costs():team();
app.innerHTML='<header><div class="row"><h1>Maintena</h1><div class="row">'+langSel()+'<button class="sm" onclick="logout()">'+T("logout")+'</button></div></div><div class="sub">'+E(me.name)+' · '+T(me.role)+(me.id?' #'+me.id:'')+' · <span id="sync">Offline demo · saved on this device only</span></div></header>'+body;
if(sdoc)sync("Shared with your team · live sync");
var sc=app.querySelectorAll("script");sc.forEach(function(x){(0,eval)(x.textContent)})}
render();
(async function(){
if(!window.claude||!claude.use)return;
try{assets=await claude.use("assets")}catch(e){}
try{var db=await claude.use("db");if(db){sdoc=db.doc("maintena/full");sync("Shared with your team · live sync");sdoc.onSnapshot(function(sn){if(sn.metadata&&sn.metadata.hasPendingWrites)return;if(sn.exists){var d=sn.data();if(d&&d.machines){S=d;if(me&&!form)render()}}},function(){})}}catch(e){}
})();
</script>
</body>
</html>
